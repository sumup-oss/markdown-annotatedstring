name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-library:
    name: Verify library build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test library
        run: ./gradlew --no-daemon :annotatedstring-generator:assembleRelease :annotatedstring-generator:testDebugUnitTest

  verify-snapshots:
    name: Verify Paparazzi snapshots
    runs-on: ubuntu-latest
    needs: verify-library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Paparazzi snapshots
        uses: ./.github/actions/verify-paparazzi

