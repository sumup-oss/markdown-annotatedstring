name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches gradle version
        if: github.event_name == 'release'
        run: |
          GRADLE_VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          TAG_NAME="${{ github.event.release.tag_name }}"
          # Strip optional leading 'v' from the tag
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match gradle.properties VERSION_NAME ($GRADLE_VERSION)"
            exit 1
          fi
          echo "✅ Tag version ($TAG_VERSION) matches gradle VERSION_NAME ($GRADLE_VERSION)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test release candidate
        run: ./gradlew --no-daemon :annotatedstring-generator:assembleRelease :annotatedstring-generator:testDebugUnitTest

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: validate
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from gradle.properties
        id: version
        run: echo "VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_ENV"

      - name: Publish snapshot to Maven Central snapshots
        if: contains(github.event.release.tag_name || '', 'SNAPSHOT') || (github.event_name == 'workflow_dispatch' && contains(env.VERSION_NAME, 'SNAPSHOT'))
        run: ./gradlew --no-daemon :annotatedstring-generator:publishAllPublicationsToMavenCentralRepository

      - name: Publish release to Maven Central
        if: "!(contains(github.event.release.tag_name || '', 'SNAPSHOT') || (github.event_name == 'workflow_dispatch' && contains(env.VERSION_NAME, 'SNAPSHOT')))"
        run: ./gradlew --no-daemon :annotatedstring-generator:publishAndReleaseToMavenCentral


